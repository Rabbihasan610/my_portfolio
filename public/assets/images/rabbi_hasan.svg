<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#d49b78"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020c1b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background circular badge with neon glow -->
  <circle cx="300" cy="300" r="280" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="url(#glow)"/>
  <circle cx="300" cy="300" r="278" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="16 8" opacity="0.85"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Code / Circuit grid decorative marks -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
    <path d="M 90 200 L 140 200 L 160 220 L 210 220"/>
    <circle cx="90" cy="200" r="3" fill="#38bdf8"/>
    <circle cx="210" cy="220" r="3" fill="#38bdf8"/>
    
    <path d="M 510 200 L 460 200 L 440 220 L 390 220"/>
    <circle cx="510" cy="200" r="3" fill="#38bdf8"/>
    <circle cx="390" cy="220" r="3" fill="#38bdf8"/>

    <path d="M 120 400 L 170 400 L 190 380"/>
    <path d="M 480 400 L 430 400 L 410 380"/>
  </g>

  <!-- Professional Developer Illustration -->
  <!-- Shoulders & Coat -->
  <g filter="url(#shadow)">
    <path d="M 120 560 C 140 430, 210 400, 300 400 C 390 400, 460 430, 480 560 Z" fill="url(#suitGrad)"/>
    <!-- Collar & Shirt -->
    <path d="M 250 400 L 300 470 L 350 400 Z" fill="#f8fafc"/>
    <path d="M 285 400 L 300 500 L 315 400 Z" fill="#6366f1"/>
    <!-- Blazer Lapels -->
    <path d="M 200 405 L 280 520 L 270 560 L 180 560 Z" fill="#1e293b"/>
    <path d="M 400 405 L 320 520 L 330 560 L 420 560 Z" fill="#1e293b"/>
  </g>

  <!-- Neck -->
  <rect x="270" y="320" width="60" height="90" rx="10" fill="url(#skinGrad)"/>
  <path d="M 270 365 C 290 385, 310 385, 330 365 Z" fill="#c98a67" opacity="0.6"/>

  <!-- Head Base -->
  <ellipse cx="300" cy="260" rx="85" ry="105" fill="url(#skinGrad)" filter="url(#shadow)"/>

  <!-- Ears -->
  <ellipse cx="215" cy="265" rx="14" ry="24" fill="url(#skinGrad)"/>
  <ellipse cx="385" cy="265" rx="14" ry="24" fill="url(#skinGrad)"/>

  <!-- Hair (Clean modern quiff hairstyle) -->
  <path d="M 215 240 C 210 180, 240 140, 300 135 C 360 140, 390 180, 385 240 C 375 200, 340 180, 300 180 C 260 180, 225 200, 215 240 Z" fill="#18181b"/>
  <path d="M 220 220 C 240 160, 320 145, 380 170 C 350 155, 270 165, 230 215 Z" fill="#27272a"/>

  <!-- Modern Tech Eyeglasses -->
  <rect x="235" y="235" width="55" height="38" rx="8" fill="none" stroke="#38bdf8" stroke-width="4.5"/>
  <rect x="310" y="235" width="55" height="38" rx="8" fill="none" stroke="#38bdf8" stroke-width="4.5"/>
  <line x1="290" y1="250" x2="310" y2="250" stroke="#38bdf8" stroke-width="4.5"/>
  <line x1="220" y1="245" x2="235" y2="245" stroke="#38bdf8" stroke-width="3"/>
  <line x1="365" y1="245" x2="380" y2="245" stroke="#38bdf8" stroke-width="3"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="262" cy="254" rx="7" ry="6" fill="#18181b"/>
  <circle cx="264" cy="252" r="2" fill="#ffffff"/>
  <ellipse cx="338" cy="254" rx="7" ry="6" fill="#18181b"/>
  <circle cx="340" cy="252" r="2" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 240 224 Q 262 216 285 224" stroke="#18181b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 315 224 Q 338 216 360 224" stroke="#18181b" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M 300 252 L 296 284 Q 300 290 306 288" stroke="#c98a67" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Beard & Mustache (Neat trim) -->
  <path d="M 285 304 Q 300 298 315 304" stroke="#27272a" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 255 295 C 265 345, 335 345, 345 295 C 330 330, 270 330, 255 295 Z" fill="#27272a"/>

  <!-- Smile -->
  <path d="M 288 315 Q 300 324 312 315" stroke="#991b1b" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Developer Headset / Audio Cans (representing high-focus engineering) -->
  <path d="M 205 240 C 205 150, 395 150, 395 240" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <rect x="195" y="240" width="22" height="50" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <rect x="383" y="240" width="22" height="50" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>

  <!-- Futuristic Floating Tech Badges on Avatar -->
  <!-- Laravel Badge -->
  <g transform="translate(70, 320)" filter="url(#shadow)">
    <rect width="110" height="42" rx="21" fill="#0f172a" stroke="#ff2d20" stroke-width="2"/>
    <circle cx="24" cy="21" r="12" fill="#ff2d20" opacity="0.2"/>
    <text x="24" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ff2d20" text-anchor="middle">&lt;/&gt;</text>
    <text x="64" y="26" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Laravel</text>
  </g>

  <!-- PHP 8.3 Badge -->
  <g transform="translate(420, 320)" filter="url(#shadow)">
    <rect width="110" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="24" cy="21" r="12" fill="#818cf8" opacity="0.2"/>
    <text x="24" y="26" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">PHP</text>
    <text x="66" y="26" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">8.3 / API</text>
  </g>

  <!-- Online Verified Badge -->
  <g transform="translate(245, 530)" filter="url(#shadow)">
    <rect width="110" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="260" cy="546" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="305" y="551" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#ecfdf5" text-anchor="middle">ACTIVE NOW</text>
  </g>
</svg>
